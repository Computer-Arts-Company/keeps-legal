<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f4f0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title }} · Keeps</title>
    <link rel="icon" type="image/png" href="{{ '/assets/keeps-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Keeps legal home">
        <img src="{{ '/assets/keeps-icon.png' | relative_url }}" alt="" width="44" height="44">
        <span>Keeps</span>
      </a>
      <nav aria-label="Legal and support">
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/terms/' | relative_url }}">Terms</a>
        <a href="{{ '/support/' | relative_url }}">Support</a>
      </nav>
    </header>

    <main class="page-shell{% if page.home %} home-shell{% endif %}">
      <article class="paper">
        {{ content }}
      </article>
    </main>

    <footer>
      <span>Computer Arts Company</span>
      <span>© 2026</span>
    </footer>
  </body>
</html>
